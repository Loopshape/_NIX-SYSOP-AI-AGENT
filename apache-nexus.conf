# Apache Proxy Configuration for NEXUS Bridge
# Add this to your VirtualHost or .htaccess (if allowed)

ProxyRequests Off
ProxyPreserveHost On

<Location /api/ask>
    ProxyPass http://127.0.0.1:7070/api/ask
    ProxyPassReverse http://127.0.0.1:7070/api/ask
</Location>

# Ensure CORS headers are handled if needed by Apache
# Header set Access-Control-Allow-Origin "*"