<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS-2244 | Cognition Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <header>
                <h1>NEXUS-2244</h1>
                <div id="status">STATUS: ONLINE</div>
            </header>
            <div class="log-container" id="logs">
                <div class="log-entry">System initialized. Waiting for input...</div>
            </div>
            <div class="controls">
                <textarea id="prompt-input" placeholder="Enter cognitive prompt..."></textarea>
                <button id="execute-btn">EXECUTE SWARM</button>
            </div>
        </div>
        <div class="main-content">
            <iframe src="graph.html" id="graph-frame" style="width:100%; height:100%; border:none;"></iframe>
            <div class="overlay" id="details">
                <h3>COGNITIVE STATE</h3>
                <div id="state-info">Select a node in the 3D graph to view details.</div>
            </div>
        </div>
    </div>
    <script>
        const logs = document.getElementById('logs');
        const executeBtn = document.getElementById('execute-btn');
        const promptInput = document.getElementById('prompt-input');
        const details = document.getElementById('state-info');

        function addLog(msg) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.prepend(div);
        }

        executeBtn.addEventListener('click', async () => {
            const prompt = promptInput.value;
            if (!prompt) return;
            addLog(`Orchestrating swarm for: ${prompt.substring(0, 30)}...`);
            executeBtn.disabled = true;
            
            try {
                const response = await fetch('/api/orchestrate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                addLog(`Orchestration complete. Hash: ${data.hash.substring(0, 8)}`);
                promptInput.value = '';
            } catch (err) {
                addLog(`Error: ${err.message}`);
            } finally {
                executeBtn.disabled = false;
            }
        });

        // Listen for updates from graph
        window.addEventListener('message', (event) => {
            if (event.data.type === 'NODE_SELECTED') {
                const node = event.data.node;
                details.innerHTML = `
                    <strong>Hash:</strong> ${node.hash.substring(0, 16)}...<br>
                    <strong>Time:</strong> ${node.time}<br>
                    <strong>Entropy:</strong> ${node.entropy.toFixed(4)}<br>
                    <strong>Prompt:</strong> ${node.prompt}
                `;
            }
        });
    </script>
</body>
</html>
